# ---------------------------------------------------------------
# テーマ別（自由に追加できます）
# kind は画面の分類名になります。google_news はGoogleニュース検索の式です。
# exclude に書いた語を見出しか概要に含む記事は取り込みません。
# ---------------------------------------------------------------
[[feeds]]
name = "ケータイ Watch"
kind = "通信"
url = "https://k-tai.watch.impress.co.jp/data/rss/1.0/ktw/feed.rdf"

[[feeds]]
name = "ITmedia Mobile"
kind = "通信"
url = "https://rss.itmedia.co.jp/rss/2.0/mobile.xml"

[[feeds]]
name = "総務省 報道発表"
kind = "通信"
url = "https://www.soumu.go.jp/news.rdf"

[[feeds]]
name = "Googleニュース：通信キャリア"
kind = "通信"
google_news = "(ドコモ OR KDDI OR ソフトバンク OR 楽天モバイル OR 通信障害 OR 5G OR 光回線) -ホークス -野球 -投手 -日本シリーズ"
exclude = ["ホークス", "野球", "投手", "打線", "日本シリーズ", "日本S", "CS", "巨人", "DeNA", "阪神", "セ・リーグ", "パ・リーグ", "スポニチ", "日刊スポーツ", "スポーツ報知"]

[[feeds]]
name = "Google News: Telecom"
kind = "通信"
lang = "en"
google_news = "telecom OR \"mobile carrier\" OR \"network outage\" OR 5G OR 6G"

# ---------------------------------------------------------------
# トピック（画面上の絞り込みボタン。キーワードのどれかを含む記事が出ます）
# exclude に書いた語を含む記事は除外されます。
# 画面からも自分用のトピックを追加できます。
# ---------------------------------------------------------------
[[topics]]
name = "通信キャリア"
keywords = ["ドコモ", "docomo", "KDDI", "au", "ソフトバンク", "SoftBank", "楽天モバイル", "Rakuten Mobile", "povo", "ahamo", "MVNO", "格安SIM"]
exclude = ["ホークス", "野球", "投手", "打線", "日本シリーズ", "日本S", "CS", "巨人", "DeNA", "阪神", "セ・リーグ", "パ・リーグ", "スポニチ", "日刊スポーツ", "スポーツ報知"]

[[topics]]
name = "ネットワーク・回線"
keywords = ["通信障害", "回線", "光回線", "5G", "6G", "基地局", "Starlink", "スターリンク", "衛星通信", "outage", "network", "broadband", "telecom", "NTT"]
