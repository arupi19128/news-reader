# ニュースレーダーの設定ファイル
# ここを書き換えて GitHub に push すると、次回の自動更新から反映されます。

[settings]
# 記事を残す日数
keep_days = 7
# 1つの情報源から取り込む最大件数
max_items_per_feed = 40
# 「テレビで報道済み」と判定する一致度（0〜1）。下げると判定が甘くなる
tv_match_threshold = 0.32
# テレビ報道と照らし合わせる期間（記事の前後何時間か）
tv_match_window_hours = 72
# ---- AI（ANTHROPIC_API_KEY を登録したときだけ動きます）----
# 使うモデル
model = "claude-opus-5-5"
# 記事に付けるカテゴリ（画面の絞り込みボタンになります）
categories = ["政治", "経済", "国際", "社会", "IT・通信", "科学・環境", "健康・医療", "文化・スポーツ"]
# AIを動かす時刻（日本時間）。この時刻だけ、日本語化・分類・厳選・解説を行います。
# それ以外の毎時の実行は記事集めとテレビ照合だけで、トークンを使いません。
pick_hours_jst = [7, 16, 22]
# 1回に厳選する本数（3回×7本＝1日約21本）
picks_per_round = 7
# 1回に解説を書く最大本数（失敗した分は次の回に書き直します）
explain_max_per_run = 9
# 1回に日本語化・分類する最大件数（直近24時間の新着から）
label_max_per_round = 200
# 厳選記事を残す日数
picks_keep_days = 30

