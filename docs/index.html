<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ニュースレーダー</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column; a sticky control bar; cards marked by a TV-coverage stripe */
:root {
  --bg: #eef0f2;
  --surface: #ffffff;
  --ink: #17212b;
  --muted: #5b6672;
  --line: #d5dae0;
  --accent: #0d6b67;
  --accent-soft: #d9ecea;
  --signal: #b9470f;
  --signal-soft: #fbe7dc;
  --covered: #8a95a1;
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11171c;
    --surface: #182129;
    --ink: #e4e9ee;
    --muted: #97a3ae;
    --line: #2a3640;
    --accent: #4fc1b9;
    --accent-soft: #173a39;
    --signal: #f08a4b;
    --signal-soft: #3d2416;
    --covered: #66727d;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.7 var(--font-body);
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 820px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

header.top { padding-block: 28px 18px; display: grid; gap: 14px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  margin: 0;
  font: 900 clamp(26px, 5vw, 34px)/1.15 var(--font-display);
  letter-spacing: 0.02em;
}
h1 .dot { display: inline-block; width: 0.42em; height: 0.42em; border-radius: 50%; background: var(--signal); margin-left: 0.12em; vertical-align: 0.35em; }
.updated { font: 12px/1.4 var(--font-mono); color: var(--muted); }
.lede { margin: 0; color: var(--muted); max-width: 62ch; }

.stats { display: flex; gap: 8px; flex-wrap: wrap; }
.stat {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
}
.stat b { font: 500 22px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.stat.hot b { color: var(--signal); }
.stat span { font-size: 12px; color: var(--muted); }

.controls {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding-block: 10px;
}
.controls .wrap { display: grid; gap: 8px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.row-label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); min-width: 4.5em; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-size: 13px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 3px 12px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.chip .x { font-size: 15px; line-height: 1; opacity: 0.7; }
.chip.ghost { border-style: dashed; color: var(--muted); }

.search { flex: 1 1 200px; min-width: 0; }
.search input, .addtopic input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-size: 14px;
}
.addtopic { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
[hidden] { display: none !important; }
.addtopic input { flex: 1 1 140px; width: auto; min-width: 0; }
.addtopic button { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 8px; padding: 6px 14px; cursor: pointer; }
.addtopic .cancel { background: none; color: var(--muted); border-color: var(--line); }

main { padding-block: 16px 48px; display: grid; gap: 22px; }
.day h2 {
  margin: 0 0 8px; font: 700 13px/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 10px;
}
.day h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.list { display: grid; gap: 8px; }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px 14px 12px 18px; position: relative; min-width: 0;
}
.card::before {
  content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 0 3px 3px 0;
  background: var(--covered);
}
.card.uncovered::before { background: var(--signal); }
.card.unknown::before { background: var(--line); }
.meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.meta time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.tag { border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 1.8; background: var(--accent-soft); color: var(--accent); }
.badge { border-radius: 4px; padding: 0 6px; font-size: 11px; line-height: 1.8; font-weight: 700; }
.badge.uncovered { background: var(--signal-soft); color: var(--signal); }
.badge.covered { border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
.badge.unknown { border: 1px dashed var(--line); color: var(--muted); font-weight: 400; }
.card h3 { margin: 4px 0 2px; font: 700 16px/1.5 var(--font-body); text-wrap: pretty; overflow-wrap: anywhere; }
.card h3 a { text-decoration: none; }
.card h3 a:hover { text-decoration: underline; }
.orig { margin: 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.summary { margin: 6px 0 0; font-size: 14px; overflow-wrap: anywhere; }
.tvline { margin: 8px 0 0; font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.tvline a { color: var(--muted); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 24px; color: var(--muted); }
.empty strong { color: var(--ink); display: block; margin-bottom: 4px; }

footer { border-top: 1px solid var(--line); padding-block: 20px 40px; color: var(--muted); font-size: 13px; }
footer details { margin-top: 8px; }
footer summary { cursor: pointer; }
.feeds { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 4px 16px; margin-top: 8px; padding: 0; list-style: none; }
.feeds li { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.feeds .ok { color: var(--accent); }
.feeds .ng { color: var(--signal); }
.more { display: block; margin: 4px auto 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 18px; cursor: pointer; }

@media (max-width: 480px) {
  .row-label { width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color 0.15s; }
  .card:hover { border-color: var(--muted); }
}
</style>
</head>
<body>
<header class="top wrap">
  <div class="brand">
    <h1>ニュースレーダー<span class="dot" aria-hidden="true"></span></h1>
    <span class="updated" id="updated">読み込み中…</span>
  </div>
  <p class="lede">海外メディアやテーマ別の情報源から記事を集め、国内テレビ局のニュースサイトに同じ話題が見当たらないものに<strong style="color:var(--signal)">TV未報道</strong>の印を付けています。判定は見出しの一致度による推定です。</p>
  <div class="stats" id="stats"></div>
</header>

<div class="controls">
  <div class="wrap">
    <div class="row">
      <span class="row-label">表示</span>
      <div class="seg" role="group" aria-label="テレビ報道の有無">
        <button type="button" data-cover="uncovered" aria-pressed="true">TV未報道</button>
        <button type="button" data-cover="all" aria-pressed="false">すべて</button>
        <button type="button" data-cover="covered" aria-pressed="false">TV報道あり</button>
      </div>
      <div class="search"><input id="q" type="search" placeholder="キーワードで検索" aria-label="キーワードで検索"></div>
    </div>
    <div class="row" id="kinds"><span class="row-label">分類</span></div>
    <div class="row" id="topics"><span class="row-label">トピック</span></div>
    <form class="addtopic" id="addtopic" hidden>
      <input id="topic-name" placeholder="名前（例：半導体）" required>
      <input id="topic-words" placeholder="キーワード（カンマ区切り：TSMC, ラピダス, chip）" required>
      <button type="submit">追加</button>
      <button type="button" class="cancel" id="topic-cancel">やめる</button>
    </form>
  </div>
</div>

<main class="wrap" id="main"></main>

<footer class="wrap">
  <div>データは1時間ごとに自動更新されます。情報源やトピックは <code>config.toml</code> で変更できます。</div>
  <details>
    <summary>情報源の取得状況</summary>
    <ul class="feeds" id="feeds"></ul>
  </details>
</footer>

<script>
(() => {
  const KIND_LABEL = { overseas: "海外" };
  const PAGE = 60;
  const store = {
    get(k, fallback) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };

  const state = {
    data: null,
    cover: store.get("nr.cover", "uncovered"),
    kind: store.get("nr.kind", null),
    topic: store.get("nr.topic", null),
    customTopics: store.get("nr.customTopics", []),
    q: "",
    limit: PAGE,
  };

  const $ = (id) => document.getElementById(id);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v);
    }
    for (const kid of kids) if (kid != null) n.append(kid);
    return n;
  };

  const status = (a) => a.tv_match === "unknown" ? "unknown" : a.tv_match ? "covered" : "uncovered";
  const allTopics = () => [...(state.data?.topics || []), ...state.customTopics.map((t) => ({ ...t, custom: true }))];

  function keywordMatcher(words) {
    const parts = words.map((w) => w.trim()).filter(Boolean).map((w) => {
      const esc = w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return /^[\x00-\x7f]+$/.test(w) ? `\\b${esc}\\b` : esc;
    });
    if (!parts.length) return () => false;
    const re = new RegExp(parts.join("|"), "i");
    return (text) => re.test(text);
  }

  const articleText = (a) => [a.title, a.title_ja, a.summary, a.summary_ja, a.outlet].filter(Boolean).join(" ");

  function filtered() {
    let list = state.data.articles;
    if (state.cover !== "all") list = list.filter((a) => state.cover === "covered" ? status(a) === "covered" : status(a) === "uncovered");
    if (state.kind) list = list.filter((a) => a.kind === state.kind);
    if (state.topic) {
      const t = allTopics().find((t) => t.name === state.topic);
      if (t) {
        const m = keywordMatcher(t.keywords), ex = keywordMatcher(t.exclude || []);
        list = list.filter((a) => { const text = articleText(a); return m(text) && !ex(text); });
      }
    }
    if (state.q) {
      const words = state.q.toLowerCase().split(/\s+/).filter(Boolean);
      list = list.filter((a) => { const t = articleText(a).toLowerCase(); return words.every((w) => t.includes(w)); });
    }
    return list;
  }

  const dayFmt = new Intl.DateTimeFormat("ja-JP", { month: "long", day: "numeric", weekday: "short", timeZone: "Asia/Tokyo" });
  const timeFmt = new Intl.DateTimeFormat("ja-JP", { hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });
  const fullFmt = new Intl.DateTimeFormat("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Asia/Tokyo" });

  function card(a) {
    const s = status(a);
    const badgeText = { uncovered: "TV未報道", covered: "TV報道あり", unknown: "TV照合なし" }[s];
    const meta = el("div", { class: "meta" },
      el("span", { class: `badge ${s}` }, badgeText),
      el("span", { class: "tag" }, KIND_LABEL[a.kind] || a.kind),
      el("span", {}, a.outlet),
      el("time", { datetime: a.published }, timeFmt.format(new Date(a.published))),
    );
    const title = a.title_ja || a.title;
    const kids = [meta, el("h3", {}, el("a", { href: a.link, target: "_blank", rel: "noopener" }, title))];
    if (a.title_ja) kids.push(el("p", { class: "orig", lang: "en" }, a.title));
    const summary = a.summary_ja || a.summary;
    if (summary && summary !== a.title) kids.push(el("p", { class: "summary" }, summary));
    if (s === "covered") {
      kids.push(el("p", { class: "tvline" }, `テレビ局サイトの近い見出し（${a.tv_match.outlet}）：`,
        el("a", { href: a.tv_match.link, target: "_blank", rel: "noopener" }, a.tv_match.title)));
    } else if (s === "unknown") {
      kids.push(el("p", { class: "tvline" }, "英語記事は日本語訳がないため照合していません（ANTHROPIC_API_KEY を登録すると照合されます）。"));
    }
    return el("article", { class: `card ${s}` }, ...kids);
  }

  function renderList() {
    const main = $("main");
    main.replaceChildren();
    const list = filtered();
    if (!list.length) {
      main.append(el("div", { class: "empty" }, el("strong", {}, "条件に合う記事はありません"),
        "表示を「すべて」に切り替えるか、分類・トピック・検索語を外してみてください。"));
      return;
    }
    let currentDay = null, group = null;
    for (const a of list.slice(0, state.limit)) {
      const day = dayFmt.format(new Date(a.published));
      if (day !== currentDay) {
        currentDay = day;
        group = el("div", { class: "list" });
        main.append(el("section", { class: "day" }, el("h2", {}, day), group));
      }
      group.append(card(a));
    }
    if (list.length > state.limit) {
      main.append(el("button", { type: "button", class: "more", onclick: () => { state.limit += PAGE; renderList(); } },
        `さらに表示（残り ${list.length - state.limit} 件）`));
    }
  }

  function renderChips() {
    const kinds = [...new Set(state.data.articles.map((a) => a.kind))];
    const kindRow = $("kinds");
    kindRow.replaceChildren(el("span", { class: "row-label" }, "分類"));
    for (const k of [null, ...kinds]) {
      kindRow.append(el("button", { type: "button", class: "chip", "aria-pressed": String(state.kind === k),
        onclick: () => { state.kind = k; store.set("nr.kind", k); update(); } }, k ? (KIND_LABEL[k] || k) : "すべて"));
    }

    const topicRow = $("topics");
    topicRow.replaceChildren(el("span", { class: "row-label" }, "トピック"));
    topicRow.append(el("button", { type: "button", class: "chip", "aria-pressed": String(!state.topic),
      onclick: () => { state.topic = null; store.set("nr.topic", null); update(); } }, "指定なし"));
    for (const t of allTopics()) {
      const chip = el("button", { type: "button", class: "chip", "aria-pressed": String(state.topic === t.name),
        title: t.keywords.join(", "),
        onclick: () => { state.topic = state.topic === t.name ? null : t.name; store.set("nr.topic", state.topic); update(); } }, t.name);
      if (t.custom) {
        chip.append(el("span", { class: "x", role: "button", "aria-label": `${t.name} を削除`, onclick: (e) => {
          e.stopPropagation();
          state.customTopics = state.customTopics.filter((c) => c.name !== t.name);
          store.set("nr.customTopics", state.customTopics);
          if (state.topic === t.name) { state.topic = null; store.set("nr.topic", null); }
          update();
        } }, "×"));
      }
      topicRow.append(chip);
    }
    topicRow.append(el("button", { type: "button", class: "chip ghost", onclick: () => { $("addtopic").hidden = false; $("topic-name").focus(); } }, "＋ トピックを追加"));
  }

  function renderStats() {
    const arts = state.data.articles;
    const unc = arts.filter((a) => status(a) === "uncovered").length;
    $("stats").replaceChildren(
      el("div", { class: "stat hot" }, el("b", {}, String(unc)), el("span", {}, "TV未報道")),
      el("div", { class: "stat" }, el("b", {}, String(arts.length)), el("span", {}, `記事（直近${state.data.settings.keep_days}日）`)),
      el("div", { class: "stat" }, el("b", {}, String(state.data.tv.length)), el("span", {}, "照合したテレビ見出し")),
    );
    $("updated").textContent = `最終更新 ${fullFmt.format(new Date(state.data.generated_at))}`;
    $("feeds").replaceChildren(...state.data.feeds.map((f) => el("li", {},
      el("span", { class: f.ok ? "ok" : "ng" }, f.ok ? "●" : "×"),
      el("span", {}, `${f.name}${f.ok ? `（${f.count}件）` : "：取得失敗"}`))));
  }

  function update() {
    document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.cover === state.cover)));
    state.limit = PAGE;
    renderChips();
    renderList();
  }

  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    state.cover = b.dataset.cover; store.set("nr.cover", state.cover); update();
  }));
  let qTimer;
  $("q").addEventListener("input", (e) => { clearTimeout(qTimer); qTimer = setTimeout(() => { state.q = e.target.value.trim(); state.limit = PAGE; renderList(); }, 150); });
  $("addtopic").addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("topic-name").value.trim();
    const keywords = $("topic-words").value.split(/[,、，]/).map((w) => w.trim()).filter(Boolean);
    if (!name || !keywords.length) return;
    state.customTopics = [...state.customTopics.filter((t) => t.name !== name), { name, keywords }];
    store.set("nr.customTopics", state.customTopics);
    state.topic = name; store.set("nr.topic", name);
    e.target.reset(); e.target.hidden = true;
    update();
  });
  $("topic-cancel").addEventListener("click", () => { $("addtopic").reset(); $("addtopic").hidden = true; });

  fetch("data/news.json", { cache: "no-cache" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then((data) => {
      state.data = data;
      if (!data.generated_at) {
        $("updated").textContent = "未取得";
        $("main").replaceChildren(el("div", { class: "empty" }, el("strong", {}, "まだニュースを取得していません"),
          "GitHub の Actions タブで「Update news」を一度実行すると、ここに記事が並びます。以後は1時間ごとに自動で更新されます。"));
        return;
      }
      renderStats();
      update();
    })
    .catch((err) => {
      $("updated").textContent = "読み込み失敗";
      $("main").replaceChildren(el("div", { class: "empty" }, el("strong", {}, "データを読み込めませんでした"),
        `data/news.json を取得できません（${err.message}）。少し待ってから再読み込みしてください。`));
    });
})();
</script>
</body>
</html>
