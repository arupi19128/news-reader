name: Update news

on:
  schedule:
    - cron: "17 * * * *"   # 毎時17分（UTC）
  workflow_dispatch:        # Actions 画面から手動実行もできる
  push:
    paths:
      - config.toml
      - docs/**
      - .github/workflows/**
      - scripts/**

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write     # 式場の新しいキャンペーンを Issue（メール）で知らせる

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install anthropic pypdf

      - name: Fetch news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python scripts/fetch_news.py
          python scripts/attacks.py

      - name: Check wedding fairs and campaigns
        env:
          WEDDING_NOTIFY_FILE: ${{ runner.temp }}/wedding_notice.md
        run: python scripts/wedding.py || echo "wedding check failed; the site still updates"

      - name: Notify new wedding campaigns
        env:
          GH_TOKEN: ${{ github.token }}
          NOTICE: ${{ runner.temp }}/wedding_notice.md
        run: |
          if [ -s "$NOTICE" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "式場の新しいキャンペーン（$(TZ=Asia/Tokyo date +%-m月%-d日)）" \
              --body-file "$NOTICE" || echo "could not create the notice issue"
          fi

      - name: Summarize featured stories
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/summarize.py || echo "summaries failed; the site still updates"

      - name: Commit updated data
        run: |
          git config user.name "news-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update news data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
