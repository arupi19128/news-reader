name: Deploy meeting worker

# 会議メモの要約に使う Cloudflare Worker（worker/）をデプロイします。
# Secrets: CF_WORKERS_TOKEN（Workers を編集できる Cloudflare の API トークン）、CF_ACCOUNT_ID、
#          ANTHROPIC_API_KEY（要約に使う Claude のキー）、MEETING_UIDS（使ってよい Firebase のユーザー ID、カンマ区切り）
on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Check settings
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CF_WORKERS_TOKEN or CF_ACCOUNT_ID is not set: skipping the deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Deploy
        id: deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Set secrets
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ALLOWED_UIDS: ${{ secrets.MEETING_UIDS }}
        run: |
          for name in ANTHROPIC_API_KEY ALLOWED_UIDS; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "$name is not set yet"
            fi
          done

      - name: Save the Worker URL for the site
        if: steps.check.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        run: |
          printf '// 会議メモの要約に使う Worker の URL（deploy-worker.yml が書き込みます）。\nwindow.MEETING_CONFIG = { workerUrl: "%s" };\n' "${{ steps.deploy.outputs.url }}" > docs/meeting-config.js
          git config user.name "news-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/meeting-config.js
          if git diff --cached --quiet; then
            echo "No change"
          else
            git commit -m "Update meeting worker URL"
            git pull --rebase origin main
            git push
          fi
